[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chocpilot"
dynamic = ["version"]
description = "ChocPilot - macropad 2x4 (Kailh Choc) configurator: LCD 2\" IPS, encoders, slider, LEDs"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6>=6.7",
    "pyserial>=3.5",
    "pynput>=1.7.7",
    "psutil>=5.9",
    "pydantic>=2.6",
    "pywin32>=306; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.6",
]

[project.scripts]
chocpilot = "chocpilot.main:main"

[project.gui-scripts]
chocpilotw = "chocpilot.main:main"

[tool.setuptools.dynamic]
version = { attr = "chocpilot.__version__" }

[tool.setuptools.packages.find]
include = ["chocpilot*"]

[tool.setuptools.package-data]
chocpilot = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]  # SIM105: try/except/pass jest czytelne; polskie znaki w napisach i komentarzach są zamierzone

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF059"]
"chocpilot/gui/icon_set.py" = ["E501"]  # dane SVG ikon

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["build/", "dist/"]
