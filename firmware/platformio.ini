; ChocPilot – firmware macropada 2×4 (Kailh Choc)
; Środowiska: promicro (domyślne, Pro Micro 5 V / 16 MHz + OLED 2,42"), promicro_3v3 (3,3 V / 8 MHz),
; chocpilot_v0 (własna płytka ze STM32F072CBT6, LCD 2", pokrętła, suwak, LED),
; native (testy jednostkowe na PC)

[platformio]
default_envs = promicro

; Pliki tylko jednej z płytek (reszta src/ jest wspólna).
[sources]
promicro_only = -<hal/hal_promicro.cpp> -<display_oled.cpp> -<mini_gfx.cpp>
v0_only = -<hal/hal_stm32.cpp> -<usb_descriptors.cpp> -<display_tft.cpp> -<st7789.cpp> -<controls.cpp> -<leds.cpp> -<saver.cpp> -<icons.cpp>

; ---------------------------------------------------------------------------
; Arduino / SparkFun Pro Micro (ATmega32U4), bootloader Caterina.
; Tylko 2,5 KB RAM i 28 KB flash: kodek protokołu bez bibliotek JSON, ekran przez mini_gfx
; (jeden krój 5×7 ASCII), ustawienia binarnie w EEPROM. Zużycie pamięci: README.md.
; ---------------------------------------------------------------------------
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
; Nazwa USB „ChocPilot” (producent i VID/PID zostają z definicji płytki: SparkFun 1B4F:9206 / 9204)
board_build.usb_product = "ChocPilot"
build_unflags = -std=gnu++11
build_flags =
    -DCHOCPILOT_FW_VERSION=\"1.0.0\"
    -std=gnu++14
    ; bez LCD: komenda time i pole settings.saver są pomijane (oszczędność ok. 0,8 KB flash)
    -DCHOCPILOT_NO_SAVER
    ; bez LCD: ikony klawiszy pomijane (bufor komendy icon zająłby ok. 140 B RAM)
    -DCHOCPILOT_NO_ICONS
    ; mniejszy kod: wspólne prologi funkcji, krótkie skoki (rcall) po relaksacji linkera
    -mcall-prologues
    -mrelax
    -Wl,--relax
    -fno-inline-small-functions
    ; U8x8 (sterownik SSD1309) bez bibliotek Wire i SPI – I²C obsługuje własny kod TWI
    -DU8X8_NO_HW_I2C
    -DU8X8_NO_HW_SPI
build_src_flags =
    -Wall
    -Wextra
build_src_filter = +<*> ${sources.v0_only}
lib_deps = olikraus/U8g2@^2.36.18
monitor_speed = 115200

; Pro Micro 3,3 V / 8 MHz – ten sam firmware, inna częstotliwość i VID/PID SparkFun
[env:promicro_3v3]
extends = env:promicro
board = sparkfun_promicro8

; ---------------------------------------------------------------------------
; ChocPilot v0: STM32F072CBT6 (Cortex-M0, 48 MHz z HSI48, 128 KB flash, 16 KB RAM).
; Rdzeń Arduino STM32duino bez jego USB – USB CDC + HID (złożone urządzenie) daje TinyUSB.
; Wgrywanie: bootloader DFU w ROM (BOOT0 + RESET albo komenda reboot z bootloader:true),
; `pio run -e chocpilot_v0 -t upload` (dfu-util) – patrz README.md.
; ---------------------------------------------------------------------------
[env:chocpilot_v0]
platform = ststm32
board = chocpilot_v0
framework = arduino
upload_protocol = dfu
build_flags =
    -DCHOCPILOT_BOARD_V0
    -DCHOCPILOT_FW_VERSION=\"1.1.0\"
    -Iinclude
    ; TinyUSB: konfiguracja w include/tusb_config.h, przerwanie USB w hal_stm32.cpp
    -DCFG_TUSB_MCU=OPT_MCU_STM32F0
build_src_flags =
    -Wall
    -Wextra
build_src_filter = +<*> ${sources.promicro_only}
lib_deps = https://github.com/hathach/tinyusb.git#0.18.0
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Testy jednostkowe na PC: parser protokołu, debounce, kody HID, zapis konfiguracji.
; Wymaga gcc/g++ w PATH (Windows: MinGW-w64 / MSYS2, Linux/macOS: systemowy).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++14
    -DCHOCPILOT_NATIVE
    -Wall
