; ChocPilot – firmware macropada 2×4 (Kailh Choc) z ekranem OLED 2,42" na Arduino Pro Micro
; Środowiska: promicro (domyślne, 5 V / 16 MHz), promicro_3v3 (3,3 V / 8 MHz),
; native (testy jednostkowe na PC)

[platformio]
default_envs = promicro

; ---------------------------------------------------------------------------
; Arduino / SparkFun Pro Micro (ATmega32U4), bootloader Caterina.
; Tylko 2,5 KB RAM i 28 KB flash: kodek protokołu bez bibliotek JSON, ekran przez mini_gfx
; (jeden krój 5×7 ASCII), ustawienia binarnie w EEPROM. Zużycie pamięci: README.md.
; ---------------------------------------------------------------------------
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
; Nazwa USB „ChocPilot” (producent i VID/PID zostają z definicji płytki: SparkFun 1B4F:9206 / 9204)
board_build.usb_product = "ChocPilot"
build_unflags = -std=gnu++11
build_flags =
    -DCHOCPILOT_FW_VERSION=\"1.0.0\"
    -std=gnu++14
    ; mniejszy kod: wspólne prologi funkcji, krótkie skoki (rcall) po relaksacji linkera
    -mcall-prologues
    -mrelax
    -Wl,--relax
    -fno-inline-small-functions
    ; U8x8 (sterownik SSD1309) bez bibliotek Wire i SPI – I²C obsługuje własny kod TWI
    -DU8X8_NO_HW_I2C
    -DU8X8_NO_HW_SPI
build_src_flags =
    -Wall
    -Wextra
lib_deps = olikraus/U8g2@^2.36.18
monitor_speed = 115200

; Pro Micro 3,3 V / 8 MHz – ten sam firmware, inna częstotliwość i VID/PID SparkFun
[env:promicro_3v3]
extends = env:promicro
board = sparkfun_promicro8

; ---------------------------------------------------------------------------
; Testy jednostkowe na PC: parser protokołu, debounce, kody HID, zapis konfiguracji.
; Wymaga gcc/g++ w PATH (Windows: MinGW-w64 / MSYS2, Linux/macOS: systemowy).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++14
    -DCHOCPILOT_NATIVE
    -Wall
