; ChocPilot – firmware macropada 2×4 (Kailh Choc)
; Płytka ChocPilot: STM32F072CBT6 (Cortex-M0, 48 MHz z HSI48, 128 KB flash, 16 KB RAM),
; ekran Waveshare 2" IPS LCD 240×320 (ST7789V, SPI), 2 pokrętła EC11, suwak 45 mm, 12 × WS2812B.
; Środowiska: chocpilot (firmware), native (testy jednostkowe na PC).

[platformio]
default_envs = chocpilot

; ---------------------------------------------------------------------------
; Rdzeń Arduino STM32duino bez jego USB – USB CDC + HID (złożone urządzenie) daje TinyUSB.
; Wgrywanie: bootloader DFU w ROM (BOOT0 + RESET albo komenda reboot z bootloader:true),
; `pio run -t upload` (dfu-util) albo .\flash.ps1 – patrz README.md.
; ---------------------------------------------------------------------------
[env:chocpilot]
platform = ststm32
board = chocpilot
framework = arduino
upload_protocol = dfu
build_flags =
    -DCHOCPILOT_FW_VERSION=\"1.2.0\"
    -Iinclude
    ; TinyUSB: konfiguracja w include/tusb_config.h, przerwanie USB w hal_stm32.cpp
    -DCFG_TUSB_MCU=OPT_MCU_STM32F0
build_src_flags =
    -Wall
    -Wextra
lib_deps = https://github.com/hathach/tinyusb.git#0.18.0
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Testy jednostkowe na PC: parser protokołu, debounce, kody HID, zapis konfiguracji, efekty LED.
; Wymaga gcc/g++ w PATH (Windows: MinGW-w64 / MSYS2, macOS: Xcode Command Line Tools).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++14
    -DCHOCPILOT_NATIVE
    -Wall
