; ChocPilot – firmware macropada 3×3 + enkoder + OLED
; Środowiska: kb2040 (domyślne), xiao_esp32s3, promicro / promicro_3v3 (ATmega32U4),
; native / native_compact (testy jednostkowe na PC)

[platformio]
default_envs = kb2040

[common]
fw_version = 1.0.4
lib_deps =
    olikraus/U8g2@^2.36.18
    bblanchon/ArduinoJson@^7.4.3
build_flags =
    -DCHOCPILOT_FW_VERSION=\"${common.fw_version}\"
build_src_flags =
    -Wall
    -Wextra
; chain+ uwzględnia #if – HAL drugiej płytki nie wciąga jej bibliotek
lib_ldf_mode = chain+

; ---------------------------------------------------------------------------
; Adafruit KB2040 (RP2040), rdzeń arduino-pico (Earle Philhower) + Adafruit TinyUSB
; ---------------------------------------------------------------------------
[env:kb2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_kb2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
; Nazwa USB „ChocPilot” (VID/PID zostają domyślne płytki)
board_build.arduino.earlephilhower.usb_manufacturer = ChocPilot
board_build.arduino.earlephilhower.usb_product = ChocPilot
build_flags =
    ${common.build_flags}
    -DUSE_TINYUSB
    -DCHOCPILOT_BOARD_KB2040
build_src_flags = ${common.build_src_flags}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit NeoPixel@^1.15.5
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Seeed Studio XIAO ESP32-S3, Arduino-ESP32 3.x (pioarduino), USB OTG (TinyUSB): CDC + HID
; ---------------------------------------------------------------------------
[env:xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
; Nadpisujemy extra_flags z definicji płytki (domyślnie ARDUINO_USB_MODE=1 = HW CDC/JTAG bez HID)
board_build.extra_flags =
    -DARDUINO_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    ${common.build_flags}
    -DCHOCPILOT_BOARD_XIAO_ESP32S3
    -DUSB_PRODUCT=\"ChocPilot\"
    -DUSB_MANUFACTURER=\"ChocPilot\"
    -DCORE_DEBUG_LEVEL=0
build_src_flags = ${common.build_src_flags}
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = ${common.lib_deps}
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Arduino / SparkFun Pro Micro (ATmega32U4, 5 V / 16 MHz), bootloader Caterina
; Tylko 2,5 KB RAM i 28 KB flash – wersja „kompaktowa” (CHOCPILOT_COMPACT): kodek protokołu bez
; ArduinoJson, ekran przez mini_gfx (jeden krój 5×7 ASCII), krótsze bufory, ustawienia binarnie
; w EEPROM. Szczegóły i zużycie pamięci: README.md, sekcja „Pro Micro”.
; ---------------------------------------------------------------------------
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
; Nazwa USB „ChocPilot” (producent i VID/PID zostają z definicji płytki: SparkFun 1B4F:9206 / 9204)
board_build.usb_product = "ChocPilot"
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++14
    -DCHOCPILOT_BOARD_PROMICRO
    -DCHOCPILOT_COMPACT
    ; mniejszy kod: wspólne prologi funkcji, krótkie skoki (rcall) po relaksacji linkera
    -mcall-prologues
    -mrelax
    -Wl,--relax
    -fno-inline-small-functions
    ; U8x8 (sterownik SSD1306) bez sprzętowego I²C/SPI – nie wciąga bibliotek Wire i SPI
    -DU8X8_NO_HW_I2C
    -DU8X8_NO_HW_SPI
build_src_flags = ${common.build_src_flags}
lib_ldf_mode = ${common.lib_ldf_mode}
; Bez ArduinoJson – CHOCPILOT_COMPACT ma własny kodek (protocol_codec_compact.cpp)
lib_deps = olikraus/U8g2@^2.36.18
monitor_speed = 115200

; Pro Micro 3,3 V / 8 MHz – ten sam firmware, inna częstotliwość i VID/PID SparkFun
[env:promicro_3v3]
extends = env:promicro
board = sparkfun_promicro8

; ---------------------------------------------------------------------------
; Testy jednostkowe na PC: parser protokołu, dekoder enkodera, debounce, kody HID, konfiguracja
; Wymaga gcc/g++ w PATH (Windows: MinGW-w64 / MSYS2, Linux/macOS: systemowy).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.4.3
build_flags =
    -std=gnu++14
    -DCHOCPILOT_NATIVE
    -Wall

; Te same testy dla wersji kompaktowej (Pro Micro): kodek bez ArduinoJson, zapis binarny
[env:native_compact]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DCHOCPILOT_COMPACT
